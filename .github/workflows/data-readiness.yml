name: data-readiness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run navigator-data validate
      - run: uv run navigator-data prepare-d0
      - run: git diff --exit-code -- data/d0/candidates
      - run: uv run navigator-data prepare-d0-review
      - run: git diff --exit-code -- data/d0/review/d0_review_packet.template.json
      - run: uv run navigator-data prepare-d1
      - run: git diff --exit-code -- data/d1/candidates
      - run: uv run navigator-data prepare-d2
      - run: git diff --exit-code -- data/d2/candidates
      - run: uv run navigator-data prepare-d3
      - run: git diff --exit-code -- data/d3/candidates
      - run: uv run navigator-data prepare-d4
      - run: git diff --exit-code -- data/d4/candidates
      - run: uv run pytest --cov --cov-report=term-missing
