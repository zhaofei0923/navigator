[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "navigator-api"
version = "0.1.0"
description = "Bounded full-stack internal demo API for Navigator."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.139,<0.140",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0.52,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
navigator-api-seed = "navigator_api.seed:main"
navigator-api-basic60-seed = "navigator_api.basic60_importer:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/navigator_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["../../tests/api"]

[tool.coverage.run]
branch = true
source = ["navigator_api"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
allowed-confusables = ["：", "；", "，"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["navigator_api"]
mypy_path = "src"
